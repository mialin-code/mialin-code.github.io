<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affiliate Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="page">
  <header class="top-bar">
    <div class="win-dots">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
    </div>
    <h1 class="title">MY AFFILIATE HUB</h1>
  </header>

  <section class="content-box">
    <div class="profile-window">
      <div class="win-dots small">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>

      <div class="profile-left">
        <h3 class="domain">WWW.MY.LINKS</h3>
        <h2 class="name">WELCOME!</h2>

        <p class="bio">
          Hi! I'm sharing my favorite products, tools, and finds.  
          Check out my links below for special deals, lifestyle picks,  
          and all things aesthetic + useful. 💖
        </p>

        <div class="links">
          <a href="YOUR-LINKTREE-URL" class="btn">
            🌐 Linktree
          </a>

          <a href="YOUR-PINTEREST-URL" class="btn">
            📌 Pinterest
          </a>
        </div>
      </div>

      <div class="avatar-area">
        <svg class="avatar" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="60" r="58" fill="#fff"/>
          <circle cx="46" cy="48" r="6" fill="#333"/>
          <circle cx="74" cy="48" r="6" fill="#333"/>
          <path d="M46 66c4 6 24 6 28 0" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
          <path d="M40 36c6-8 34-8 40 0" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <div class="crown">💛</div>
      </div>
    </div>
  </section>

  <footer class="bottom-shadow"></footer>
</main>

<script src="script.js"></script>
</body>
</html>
